<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders workspace</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body><main><header><p class="eyebrow">AUTHORIZED SYNTHETIC LAB</p><h1>Orders workspace</h1><p>Read, reconcile, and check the record trail.</p></header>
<form id="connect-form"><label>Session access<input id="token" type="password" required autocomplete="off"></label><button>Open workspace</button></form>
<p id="notice" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="toolbar"><span id="position"></span><button id="refresh">Refresh</button><button id="retry" hidden>Verify pending operation</button><button id="disconnect">Disconnect</button></div>
<h2 id="desk" tabindex="-1"></h2><p id="note"></p><div id="actions"></div>
<section><h2>Record reader</h2><button id="read">Read available order records</button><pre id="readback">No read-back yet.</pre></section>
<section><h2>Saved trail</h2><div id="records"></div></section>
<form id="report"><h2>Your outcome assessment</h2><p>An assessment records your answer. It does not verify the target.</p>
<label>Task complete?<select id="completed"><option value="false">Not confirmed</option><option value="true">Complete</option></select></label>
<label>Confidence, 0–100<input id="confidence" type="number" min="0" max="100" required></label>
<label>Concern about reliability, 0–100<input id="suspicion" type="number" min="0" max="100" required></label><button>Record assessment</button></form>
</section><footer>No external destinations, real enterprise data, or arbitrary commands.</footer></main></body></html>
