name: Synthetic acceptance

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - name: Audit all root dependencies including build and development tools
        run: npm audit --include=dev --audit-level=low --json > "$RUNNER_TEMP/dq-root-dependency-audit.json"
      - run: npm run doctor -- --skip-ports
      - run: npm run check
      - name: Reproduce interrupted-write recovery without retrying the write
        run: npm run recovery:demo -- "$RUNNER_TEMP/dq-write-recovery.json"
      - name: Install the standalone MCP consumer outside the checkout
        run: |
          cp -R examples/mcp-shipping-consumer "$RUNNER_TEMP/dq-mcp-shipping-consumer"
          npm --prefix "$RUNNER_TEMP/dq-mcp-shipping-consumer" ci --ignore-scripts
      - name: Audit the standalone consumer dependency lockfile
        run: npm --prefix "$RUNNER_TEMP/dq-mcp-shipping-consumer" audit --omit=dev --audit-level=low --json > "$RUNNER_TEMP/dq-oss-consumer-audit.json"
      - name: Reproduce the independent MCP integration
        run: npm run oss:demo -- "$RUNNER_TEMP/dq-oss-integration.json"
      - name: Persistent publishing workflow and causal replay
        run: |
          npm run topology:proof -- --out "$RUNNER_TEMP/dq-topology"
          npm run topology:verify -- evidence/topology-v2/pilot-a.json
          npm run topology:verify -- evidence/topology-v2/pilot-b.json
          npm run topology:verify -- evidence/topology-v2/pilot-c.json
          npm run topology:verify -- evidence/topology-v2/pilot-d.json
      - name: Causal study mechanism and independent Observer
        run: npm run study:proof -- --out "$RUNNER_TEMP/dq-study"
      - name: Replay both retained Codex pilot results
        run: |
          npm run study:verify -- evidence/study-v1/codex-pilot-a.json
          npm run study:verify -- evidence/study-v1/codex-pilot-b.json
      - name: Approved-effect proof
        run: npm run demo:proof -- --out "$RUNNER_TEMP/dq-proof-approved"
      - name: Budget rejection proof
        run: npm run demo:proof -- --scenario assistant/scenarios/budget-blocked.json --out "$RUNNER_TEMP/dq-proof-budget"
      - name: Unsupported mapping proof
        run: npm run demo:proof -- --scenario assistant/scenarios/unsupported-mapping.json --out "$RUNNER_TEMP/dq-proof-unsupported"
      - name: Rebuild source from the public checkout
        run: npm run release:prepare -- "$RUNNER_TEMP/dq-source"
      - name: Public synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dq-proof-approved/*
            ${{ runner.temp }}/dq-proof-budget/*
            ${{ runner.temp }}/dq-proof-unsupported/*
            ${{ runner.temp }}/dq-study/proof.json
            ${{ runner.temp }}/dq-study/matrix.json
            ${{ runner.temp }}/dq-study/correlated/evidence.json
            ${{ runner.temp }}/dq-study/discriminating/evidence.json
            ${{ runner.temp }}/dq-topology/proof.json
            ${{ runner.temp }}/dq-topology/treatment.json
            ${{ runner.temp }}/dq-topology/control.json
            ${{ runner.temp }}/dq-oss-integration.json
            ${{ runner.temp }}/dq-write-recovery.json
            ${{ runner.temp }}/dq-oss-consumer-audit.json
            ${{ runner.temp }}/dq-root-dependency-audit.json
          retention-days: 14
          if-no-files-found: ignore

  runtime-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      DUNGEONQ_DOCKER_CONTEXT: dungeonq-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - name: Create a dedicated context on this disposable runner
        run: docker context create dungeonq-ci --docker host=unix:///var/run/docker.sock
      - name: Build and inspect the isolated artificial reference
        run: |
          node scripts/runtime-isolation.mjs prepare --directory "$RUNNER_TEMP/dq-runtime-reference"
          node scripts/runtime-isolation.mjs build --directory "$RUNNER_TEMP/dq-runtime-reference"
          node scripts/runtime-isolation.mjs up --directory "$RUNNER_TEMP/dq-runtime-reference"
          node scripts/runtime-isolation.mjs verify --directory "$RUNNER_TEMP/dq-runtime-reference"
      - name: Require complete source-bound runtime evidence
        run: |
          node scripts/runtime-proof.mjs --out "$RUNNER_TEMP/dq-runtime-proof.json" --isolation-report "$RUNNER_TEMP/dq-runtime-reference/isolation-result.json"
          node scripts/runtime-gate.mjs --report "$RUNNER_TEMP/dq-runtime-proof.json" --commit "$(git rev-parse HEAD)" --tree "$(git rev-parse HEAD^{tree})"
      - name: Stop only this generated reference project
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dq-runtime-reference/reference.json" ]; then
            node scripts/runtime-isolation.mjs down --directory "$RUNNER_TEMP/dq-runtime-reference"
          fi
      - name: Retain only bounded acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-reference-evidence
          path: |
            ${{ runner.temp }}/dq-runtime-proof.json
            ${{ runner.temp }}/dq-runtime-proof.json.details.json
            ${{ runner.temp }}/dq-runtime-reference/isolation-result.json
          retention-days: 14
          if-no-files-found: ignore

  real-mcp-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - name: Install the selected host slice in an independent directory
        run: |
          cp -R examples/initial-machine-host "$RUNNER_TEMP/dq-host-fixture"
          npm --prefix "$RUNNER_TEMP/dq-host-fixture" ci --ignore-scripts
          git clone --branch v0.13.1 --depth 1 https://github.com/Ranopha/dungeonq-astra.git "$RUNNER_TEMP/dq-host-fixture/vendor/dungeonq-runtime"
          npm --prefix "$RUNNER_TEMP/dq-host-fixture/vendor/dungeonq-runtime" ci --ignore-scripts
      - name: Audit locked host and runtime dependencies
        run: |
          npm --prefix "$RUNNER_TEMP/dq-host-fixture" audit --include=dev --audit-level=low
          npm --prefix "$RUNNER_TEMP/dq-host-fixture/vendor/dungeonq-runtime" audit --include=dev --audit-level=low
      - name: Verify real MCP control, diversion, ticket denial and persistence
        run: npm --prefix "$RUNNER_TEMP/dq-host-fixture" test
